<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tres en Raya - Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-glow"></div>

  <main class="game-container">
    <header class="header">
      <h1 class="title">TRES EN RAYA</h1>
      
      <!-- Selector de Modo -->
      <div class="mode-selector">
        <label for="gameMode">Modo:</label>
        <select id="gameMode">
          <option value="pvp">ðŸ‘¥ 2 Jugadores (Local)</option>
          <option value="ai_easy">ðŸ¤– vs IA (FÃ¡cil)</option>
          <option value="ai_hard" selected>ðŸ§  vs IA (Imposible - Minimax)</option>
        </select>
      </div>

      <!-- Marcador -->
      <div class="scoreboard">
        <div class="score-card player-x active-player">
          <span class="player-label">JUGADOR X</span>
          <span class="score-value" id="scoreX">0</span>
        </div>
        <div class="score-card tie">
          <span class="player-label">EMPATE</span>
          <span class="score-value" id="scoreTies">0</span>
        </div>
        <div class="score-card player-o">
          <span class="player-label" id="labelO">JUGADOR O</span>
          <span class="score-value" id="scoreO">0</span>
        </div>
      </div>

      <!-- Turno / Estado -->
      <div class="status-banner" id="statusBanner">
        Turno de: <span class="current-turn x-turn" id="turnIndicator">X</span>
      </div>
    </header>

    <!-- Tablero 3x3 -->
    <div class="board" id="board">
      <button class="cell" data-index="0" aria-label="Casilla 1"></button>
      <button class="cell" data-index="1" aria-label="Casilla 2"></button>
      <button class="cell" data-index="2" aria-label="Casilla 3"></button>
      <button class="cell" data-index="3" aria-label="Casilla 4"></button>
      <button class="cell" data-index="4" aria-label="Casilla 5"></button>
      <button class="cell" data-index="5" aria-label="Casilla 6"></button>
      <button class="cell" data-index="6" aria-label="Casilla 7"></button>
      <button class="cell" data-index="7" aria-label="Casilla 8"></button>
      <button class="cell" data-index="8" aria-label="Casilla 9"></button>
    </div>

    <!-- Controles -->
    <footer class="controls">
      <button class="btn btn-primary" id="btnRestart">ðŸ”„ Nueva Partida</button>
      <button class="btn btn-secondary" id="btnResetScore">ðŸ—‘ï¸ Reiniciar Marcador</button>
      <button class="btn btn-icon" id="btnSound" title="Sonido">ðŸ”Š</button>
    </footer>
  </main>

  <!-- Modal Victoria / Fin de juego -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-card">
      <h2 class="modal-title" id="modalTitle">Â¡Victoria!</h2>
      <p class="modal-message" id="modalMessage">El Jugador X ha ganado la partida.</p>
      <button class="btn btn-primary btn-large" id="btnModalNext">Jugar de nuevo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
